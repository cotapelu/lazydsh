name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          version: 1.6.0
          node-version: 24.9.0
          package-manager: |
            bun: false
          run-install: false
          cache: true
      - run: bun install --frozen-lockfile
      - run: vp check
      - run: vp test run
      - run: vp pack
