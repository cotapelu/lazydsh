name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          version: 1.6.0
          node-version: 24.9.0
          package-manager: |
            bun: false
          run-install: false
          cache: false
      - run: bun install --frozen-lockfile
      - run: vp check
      - run: vp pack
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/**